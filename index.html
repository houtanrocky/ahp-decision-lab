<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f6f8fb" />
  <title data-i18n="hero.title"></title>
  <meta name="description" data-i18n-content="meta.description" />
  <meta property="og:type" content="website" />
  <meta property="og:title" data-i18n-content="meta.ogTitle" />
  <meta property="og:description" data-i18n-content="meta.description" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="product-shell">
    <header class="product-header">
      <a class="product-brand" href="#top" data-i18n="brand.name" data-i18n-aria-label="brand.home"></a>
      <div class="product-actions">
        <span class="privacy-label" data-i18n="privacy.badge"></span>
        <label class="language-picker" for="language-select"><span data-i18n="language.label"></span><select id="language-select" data-i18n-aria-label="language.label"><option value="en" data-i18n="language.english"></option><option value="fa" data-i18n="language.persian"></option></select></label>
        <button class="button outline sm" id="export-json" type="button" data-i18n="action.exportDecision"></button>
        <button class="button outline sm" id="import-json" type="button" data-i18n="action.importDecision"></button>
        <input id="json-file" type="file" accept=".json,application/json" hidden />
      </div>
    </header>

    <section class="product-hero" id="top">
      <div class="eyebrow" data-i18n="hero.kicker"></div>
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.description"></p>
      <p class="privacy-copy" data-i18n="hero.privacy"></p>
    </section>

    <section class="panel setup-panel" aria-labelledby="setup-title">
      <div class="section-heading"><div><div class="eyebrow small" data-i18n="setup.kicker"></div><h2 id="setup-title" data-i18n="setup.title"></h2></div><button id="reset-all" class="button text sm" type="button" data-i18n="setup.clear"></button></div>
      <div class="definition-grid">
        <section class="definition-column" aria-labelledby="options-title">
          <div class="section-heading compact-heading"><div><h3 id="options-title" data-i18n="options.title"></h3><p class="muted" data-i18n="options.question"></p></div><button id="add-option" class="button outline sm" type="button" data-i18n="options.add"></button></div>
          <div id="options-list" class="definition-list"></div>
          <p class="micro-note" data-i18n="options.hint"></p>
        </section>
        <section class="definition-column" aria-labelledby="criteria-title">
          <div class="section-heading compact-heading"><div><h3 id="criteria-title" data-i18n="criteria.title"></h3><p class="muted" data-i18n="criteria.question"></p></div><button id="add-criterion" class="button outline sm" type="button" data-i18n="criteria.add"></button></div>
          <div id="criteria-list" class="definition-list"></div>
          <p class="micro-note" data-i18n="criteria.hint"></p>
        </section>
      </div>
      <div class="setup-hint" id="setup-hint" role="status"></div>
    </section>

    <section id="workspace" class="workspace hidden">
      <nav class="tabbar" data-i18n-aria-label="nav.label">
        <button class="tab active" data-tab="analysis" type="button">02 <b data-i18n="tab.analysis"></b></button>
        <button class="tab" data-tab="method" type="button">03 <b data-i18n="tab.method"></b></button>
        <div class="tab-right"><button id="download-csv" class="button outline sm" type="button" data-i18n="action.exportCsv"></button></div>
      </nav>

      <section id="analysis" class="tab-content active">
        <div class="content-grid">
          <section class="panel comparisons-panel" aria-labelledby="judgments-title">
            <div class="panel-title-line"><div><div class="eyebrow small" data-i18n="judgments.kicker"></div><h2 id="judgments-title" data-i18n="judgments.title"></h2></div><div class="hint-circle" data-i18n-title="judgments.scaleHelp" aria-hidden="true">?</div></div>
            <p class="muted compact" data-i18n="judgments.help"></p>
            <div class="segmented" role="group" data-i18n-aria-label="judgments.layer"><button id="type-criteria" class="active" type="button" data-i18n="judgments.criteria"></button><button id="type-alternatives" type="button" data-i18n="judgments.options"></button></div>
            <div id="criterion-picker" class="picker-wrap hidden"><label for="criterion-select" data-i18n="judgments.forCriterion"></label><select id="criterion-select" class="large-select"></select></div>
            <div class="scale-info"><span data-i18n="judgments.leftPreferred"></span><span data-i18n="judgments.equal"></span><span data-i18n="judgments.rightPreferred"></span></div>
            <div id="pair-list" class="pair-list"></div>
            <details class="inner-details"><summary data-i18n="judgments.matrix"></summary><div id="editable-matrix" class="table-scroll"></div></details>
            <p class="micro-note" data-i18n="judgments.note"></p>
          </section>

          <section class="panel results-panel" aria-labelledby="result-title">
            <div class="panel-title-line"><div><div class="eyebrow small" data-i18n="results.kicker"></div><h2 id="result-title" data-i18n="results.title"></h2></div><div class="method-pill">AHP</div></div>
            <div class="method-picker"><label for="method-select" data-i18n="results.priorityCalculation"></label><select id="method-select"><option value="eigen" data-i18n="results.eigen"></option><option value="rgmm" data-i18n="results.rgmm"></option></select></div>
            <div class="meta-line"><span id="mode-label"></span><span id="criterion-cr"></span></div>
            <div id="ranking" class="ranking"></div>
            <div class="result-comment"><strong data-i18n="results.interpretation"></strong><p id="result-caveat"></p></div>
            <div class="split-title"><h3 data-i18n="results.contributions"></h3><span data-i18n="results.contributionFormula"></span></div>
            <div id="contributions" class="table-scroll"></div>
            <div class="split-title space-top"><h3 data-i18n="results.judgmentConsistency"></h3><span data-i18n="results.crGuideline"></span></div>
            <div id="consistency"></div>
          </section>
        </div>

        <section class="panel sensitivity-panel">
          <div class="sensitivity-head"><div><div class="eyebrow small" data-i18n="scenario.kicker"></div><h2 data-i18n="scenario.title"></h2><p class="muted compact" data-i18n="scenario.description"></p></div>
            <div class="scenario-control"><label for="scenario-toggle"><input id="scenario-toggle" type="checkbox" /> <span data-i18n="scenario.apply"></span></label><label for="scenario-slider" class="range-title"><span id="scenario-weight-name"></span><strong id="scenario-percent"></strong></label><input type="range" id="scenario-slider" min="0" max="100" step="1" value="50" /><label for="scenario-criterion" class="tiny-label" data-i18n="scenario.chooseCriterion"></label><select id="scenario-criterion"></select></div>
          </div>
          <div id="sensitivity-chart" class="chart-wrap"></div><div class="chart-legend" id="chart-legend"></div><div class="sensitivity-foot"><div id="sensitivity-note"></div></div>
        </section>
      </section>

      <section id="method" class="tab-content">
        <div class="panel"><div class="eyebrow small" data-i18n="method.kicker"></div><h2 data-i18n="method.title"></h2><div class="method-grid">
          <article><div class="step-num">01</div><h3 data-i18n="method.step1.title"></h3><p data-i18n="method.step1.body"></p><code data-i18n="method.step1.formula"></code></article>
          <article><div class="step-num">02</div><h3 data-i18n="method.step2.title"></h3><p data-i18n="method.step2.body"></p><code data-i18n="method.step2.formula"></code></article>
          <article><div class="step-num">03</div><h3 data-i18n="method.step3.title"></h3><p data-i18n="method.step3.body"></p><code data-i18n="method.step3.formula"></code></article>
          <article><div class="step-num">04</div><h3 data-i18n="method.step4.title"></h3><p data-i18n="method.step4.body"></p><code data-i18n="method.step4.formula"></code></article>
        </div><div class="method-alert" data-i18n="method.warning"></div></div>
        <div class="panel"><div class="panel-title-line"><div><div class="eyebrow small" data-i18n="audit.kicker"></div><h2 id="audit-heading" data-i18n="audit.title"></h2></div><div class="method-pill" id="audit-method"></div></div><div id="audit-summary"></div><div id="all-matrices"></div></div>
        <div class="panel"><h2 data-i18n="privacy.title"></h2><p data-i18n="privacy.body"></p><p data-i18n="privacy.clearHelp"></p></div>
      </section>
    </section>

    <footer class="footer"><span><span data-i18n="brand.name"></span> · <span data-i18n="footer.tagline"></span></span><span data-i18n="footer.promise"></span></footer>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="src/data.js"></script><script src="src/model.js"></script><script src="src/ahp.js"></script><script src="src/i18n.js"></script><script src="src/app.js"></script>
</body>
</html>
